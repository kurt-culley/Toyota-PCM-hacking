name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache assemblers
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools/setup_assemblers.sh', 'tools/setup_mame_ref.sh', 'tools/mame_ref/**', 'TOYOTA Bluetop PCM/dasm/src/**') }}

      - name: Build asl and dasm
        run: tools/setup_assemblers.sh

      - name: Build the MAME HD6301 reference (emulator tests)
        run: tools/setup_mame_ref.sh

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: "Tests (P0 gates: round-trip, xref, emulator vs MAME)"
        run: uv run pytest
        env:
          REQUIRE_MAME_REF: "1"

      - name: Round-trip report
        run: uv run python -m pcmre.roundtrip
        env:
          PYTHONPATH: analysis

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [olimex_rp2350_pico2_bb48, pico2_w]
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build

      - name: Fetch pico-sdk 2.1.1
        run: |
          git clone --depth 1 -b 2.1.1 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb

      - name: Build the reader UF2 (warnings are errors)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S hardware/rp2350-reader/firmware -B build -G Ninja -DPICO_BOARD=${{ matrix.board }}
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: rp2350_reader_${{ matrix.board }}
          path: build/rp2350_reader_${{ matrix.board }}.uf2
