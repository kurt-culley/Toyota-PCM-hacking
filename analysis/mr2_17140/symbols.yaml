# Names and notes for the MR2 89661-17140 ROM. The single hand-maintained record of what we
# know about this program; `python -m pcmre.symlisting mr2_17140 --write` regenerates the
# labelled source and the cross-reference report from it. Tag every note with its evidence
# and confidence. First pass (P4 step 1): names are working names, not conclusions.
title: MR2 AW11 ECU 89661-17140 (D151801-7110), $F000-$FFFF
rom:
  file: AW11 MR2 PCM/89661-17140.bin
ram:
  0x40:
    name: SelfTestMark
    note: RAM/ROM self-test result word $40/$41; also fault-code bits (oraa $40) [ROM:$F330, $F71D] LIKELY
  0x42:
    name: FaultBits2
    note: second fault-bit word, set with $40 [ROM:$F72A] GUESS
  0x44:
    name: TpsOpen
    note: throttle opening above the learned closed position $45 (ADC ch2) [ROM:$FCCA-$FD07] LIKELY
  0x45:
    name: TpsZero
    note: learned closed-throttle reading, clamped $06..$31, default $2C [ROM:$FCCA-$FCFC] LIKELY
  0x46:
    name: Load
    note: manifold pressure, 16-bit, filtered (ADC ch1, normalised by ch7) [ROM:$FD76-$FD92] LIKELY; kPa scaling still to measure
  0x4a:
    name: MapRaw
    note: 'manifold pressure, 8-bit (ADC ch1); on a sensor fault the immediate value #$4D is used [ROM:$FD70-$FD76] LIKELY'
  0x4d:
    name: CoolantCorr
    note: written by the ch5 coolant handler from table $F090 [ROM:$FE2C-$FE33]; meaning GUESS
  0x50:
    name: AdcZero
    note: ADC ch0 conversion time, subtracted from every other channel [ROM:$FC32-$FC4A] LIKELY
  0x53:
    name: Coolant
    note: coolant reading (ADC ch5), latched when the event flag $C9 is set; $1E on a sensor fault [ROM:$FE1F-$FE2B] LIKELY
  0x55:
    name: AdcRef
    note: ADC ch7 (reference) via table $F044; scales every other channel (Mul by $55+410) [ROM:$FC4D-$FC64] LIKELY
  0x5e:
    name: ThaCorr
    note: intake-air-temperature fuel correction from table $F083 (ADC ch6) [ROM:$FE0A-$FE12] LIKELY
  0x5f:
    name: Tha
    note: intake air temperature reading (ADC ch6); $79 on a fault [ROM:$FE0A] LIKELY
  0x61:
    name: SecretRpmFuel
    note: rpm fuel correction from table $F117, used only when PORT3 bit 4 (P34) = 0; otherwise the fixed $66 (x1.00) [ROM:$F465-$F46C, $FAC2-$FACB] LIKELY (Ross R-F12); $F117 = 3 sites 1200/2000/2800 rpm
      -> x1.00/1.025/1.05
  0x8a:
    name: InjDeadTime
    note: battery-voltage injector dead time from table $F0A4 (ADC ch4) [ROM:$FE14-$FE1E] LIKELY
  0x8c:
    name: Mixture
    note: mixture-adjust (VAF/CO resistor, ADC ch3), $80 on a fault; used as reading - $80 [ROM:$FC6A-$FC96, $FAF5] LIKELY (Ross R-M01)
  0x59:
    name: InjFlags
    note: bit 7/6 flags around injection [ROM:$F4BC, $FC0C] GUESS
  0x5a:
    name: StateFlags
    note: status bits; bit 3 mirrors PORT3 bit 3 changes [ROM:$FBD0] GUESS
  0x73:
    name: RpmIndex
    note: 'byte from the crank period ($77 -> sub_F9D4) [ROM:$F44F]; compared with #$64/#$C8/#$DC LIKELY: engine speed'
  0x77:
    name: RpmWord
    note: 'engine speed: reciprocal of the NE period sum (table $F031 + shifts) [ROM:$F41F-$F44C]; rpm x 0.32 (LIKELY: the staircase sites in $F1C5/$F1D7 come out at round rpm, and $0400 = 3200 rpm is the
      speed-map split)'
  0x7c:
    name: NEperiod0
    note: NE edge interval x/2, written by IRQ_ICF for even edge counts [ROM:$FF24-$FF35] CONFIRMED (code)
  0x7e:
    name: NEperiod1
    note: see NEperiod0
  0x80:
    name: NEperiod2
    note: see NEperiod0
  0x84:
    name: LastNEtime
    note: ICR2 at the previous counted NE edge [ROM:$FF33]
  0x88:
    name: InjPulse
    note: injection pulse length handed to sub_FFB7 [ROM:$FF07-$FF11] LIKELY
  0x8d:
    name: OC1next
    note: next output-compare-1 time (OCR1) [ROM:$FE7A, $FFE0] CONFIRMED (code)
  0x90:
    name: AdcStart
    note: FRC when the ADC measurement started at OC1 [ROM:$FE8F]; ICR1 - AdcStart = conversion time [ROM:$FC33] LIKELY
  0x92:
    name: OC1period
    note: periodic OC1 schedule, += 1000 or 4000 us [ROM:$FE83-$FE99] LIKELY
  0x97:
    name: NEcount
    note: NE edge counter 0..5, reset when PORT3 bit 5 (G) is seen [ROM:$FEC7-$FEDF] LIKELY
  0x99:
    name: ModeFlags
    note: engine-state bits (bit 7, bit 1 used everywhere) [ROM:$F604] GUESS
  0x9e:
    name: IgnEdge
    note: NE edge (0..5) on which the spark is scheduled [ROM:$F848, $FF5E] LIKELY
  0x9f:
    name: IgnDelay
    note: delay from that edge to the spark/dwell (us) [ROM:$F848, $FF61] LIKELY
  0xa8:
    name: IgnBase
    note: base advance from the 2D map $F1EF (P34=1) or $F25D (P34=0) over RpmWord x Load; when ModeFlags bit 7 is set, from the 1-D rpm table $F0FA instead [ROM:$FD96-$FDA3]; +13 when $72 bit 7 [ROM:$FDDA];
      then the PORT4 bits 2-3 trim from $F01A. SvcIgnition copies it to $AB and sums $A8+$A9+$AA+$AB, so it counts twice [ROM:$F7F0, $F806]. Larger = more advance (delay = $05AA - sum) [ROM:$F81B-$F824]
      CONFIRMED (code)
  0xa7:
    name: StartCount
    note: counts OC2 events up to 4 [ROM:$FE54-$FE6B] GUESS
  0xc0:
    name: NEtime
    note: ICR2 at the latest NE edge [ROM:$FEC2]
  0xc5:
    name: OC2next
    note: next output-compare-2 time (ignition) [ROM:$FE3F, $FF8C] LIKELY
  0xc7:
    name: EvLoad
    note: event flag set by IRQ_ICF, handled in sub_F84D [ROM:$FF4C, $F8BB] LIKELY
  0xc8:
    name: EvRpm
    note: event flag set by IRQ_ICF on edge 1, handled in sub_F84D [ROM:$FF53, $F84D] LIKELY
  0xc9:
    name: EvCoolant
    note: event flag set on edge 2 [ROM:$FF5E] GUESS
  0xca:
    name: EvEdge2
    note: event flag set on edge 2 when $B7 bit 7 [ROM:$FF5C, $F886] GUESS
  0xcc:
    name: DiagFlags
    note: 'bit 0 set after a serial RAM-peek reply [ROM:$F41B]; checked and cleared about once a second, and the SCI is switched off if it was clear (link keep-alive) [ROM:$F62E-$F641] CONFIRMED (code, EMU); bit 7 tested widely GUESS'
  0x64:
    name: Counters
    note: '8 saturating up-counters $64-$6B, all incremented together at $FBC8 [ROM:$FBC8-$FBCD] CONFIRMED (code); $6A is the link keep-alive timer'
  0x6a:
    name: LinkTimer
    note: 'keep-alive timer for the serial link: every time it reaches $FA (about 1.0 s in the simulator) the link is checked [ROM:$F62E-$F641] CONFIRMED (code, EMU:tests/test_peek17140.py)'
labels:
  0xf11d:
    name: Lookup1D_a
    note: table-lookup helper family $F11D-$F16A (entered at several offsets with X = table) [xref] LIKELY
  0xf16a:
    name: Lookup2D
    note: '2D lookup: header [off1 word, max1, off2 word, max2], then rows; interpolates both ways [ROM:$F16A-$F195] LIKELY'
  0xf2be:
    name: Reset
    note: reset vector (also SWI, NMI, IRQ1, TOF, SCI) [ROM:$FFF0-$FFFF]
    block: 'Reset: accept only mode 7 (single chip) or mode 2 (expanded multiplexed), else hang.

      Then ports, timers, SCI, optional ROM checksum ($AA55) and RAM test, RAM clear.

      '
  0xf371:
    name: MainLoop
    note: 'main loop: re-initialises SP, DDRs and RAMCR every pass [ROM:$F371-$F6E3] LIKELY'
  0xf3e4:
    name: NEperiodSum
    note: D = $7C + $7E + $80, saturating [ROM:$F3E4-$F3F1] CONFIRMED (code)
  0xf403:
    name: SerialPeek
    note: 'RAM peek: a byte received on the SCI is an address $00-$FF (X = 0 here); the word there is sent back, high byte first; overrun/framing errors are ignored [ROM:$F403-$F41E] CONFIRMED (code, EMU)'
    block: 'Diagnostic link (docs/mr2/serial_link.md): enabled at reset only if P23 (SCI RX, pin 11) is low,

      7812.5 baud (E/128), read-only, page zero only, switched off after about 1 s without a request.

      '
  0xf33b:
    name: LinkEnable
    note: 'TRCSR = RE+TE (SCI on, no interrupts) only if PORT2 bit 3 (P23 = SCI RX, chip pin 11) reads low at reset [ROM:$F33B-$F343] CONFIRMED (code, EMU)'
  0xf62e:
    name: LinkKeepAlive
    note: 'every $FA counts of LinkTimer: if no peek was answered (DiagFlags bit 0 clear) switch the SCI off until the next reset [ROM:$F62E-$F641] CONFIRMED (code, EMU)'
  0xf7ec:
    name: SvcIgnition
    note: computes the spark edge/delay $9E/$9F from the crank period [ROM:$F81B-$F84C] LIKELY
  0xf84d:
    name: SvcEvents
    note: handles the edge-event flags $C8/$CA/$C7 set by IRQ_ICF, then falls into SvcAdc [ROM:$F84D-$F8BF] LIKELY
  0xfb23:
    name: SvcAdc
    note: 'when TCSR ICF (bit 7) is set: read the finished conversion, select the next channel on PORT1 bits 2-4 [ROM:$FB5F-$FB96] LIKELY'
  0xfb33:
    name: Mul16
    note: 16 x 16 multiply, saturating at $FFFF; result in X [ROM:$FB33-$FB5E] LIKELY
  0xfe36:
    name: IRQ_OCF
    note: output-compare interrupt [ROM:$FFF4]
    block: 'OC2 (TCSR2 bit 6): reload OCR2 from OC2next ($C5): ignition timing.

      OC1 (TCSR bit 6): ADC start (clear PORT1 bits 5-7, stamp FRC in $90), periodic OC1 schedule,

      and the injector pulse on Tout1 (P21) via $8D. LIKELY

      '
  0xfeb4:
    name: IRQ_ICF
    note: input-capture interrupt [ROM:$FFF6]
    block: 'IC2 (TCSR2 flags): NE crank edge. Counts edges 0..5 in $97 (G seen on PORT3 bit 5 resets it),

      stores half-periods in $7C/$7E/$80, sets the event flags $C7-$CA, schedules injection

      (sub_FFB7) and the spark (OCR2 = edge time + $C3 + $9C). LIKELY

      '
  0xffb7:
    name: SchedInj
    note: 'schedule the end of an injector pulse: OC1next = FRC + D (+ $22) [ROM:$FFB7-$FFE0] LIKELY'
  0xfc32:
    name: AdcResult
    note: 'conversion done: D = ICR1 - AdcStart; A = channel (pushed by SvcAdc); dispatch per channel [ROM:$FC32-$FE35] LIKELY'
    block: 'ADC channels (PORT1 bits 2-4): 0 zero ref -> $50, 1 MAP -> $4A/$46, 2 throttle -> $44/$45,

      3 mixture (VAF) -> $8C, 4 battery -> $8A dead time, 5 coolant -> $53, 6 intake air -> $5F/$5E,

      7 reference -> $55. LIKELY (from the code paths and their consumers; to be confirmed in the simulator)'
  0xf9f0:
    name: DensityLookup
    note: X = table pair; uses the second table at rpm >= 3200 (RpmWord >= $0400); input Load [ROM:$F9F0-$FA01] LIKELY
  0xfdae:
    name: IgnMapSelect
    note: PORT3 bit 4 (P34, jumper J8) selects ignition map $F1EF (1) or $F25D (0) [ROM:$FDCF-$FDD5] LIKELY (Ross R-I15)
  0xf000:
    name: Tables
    note: 'calibration tables and descriptors $F000-$F2BD, except code at $F01E-$F03A (range check and clamp); $F000-$F002 = 3F 3F 3F (SWI opcodes: a stray jump to the start of the ROM traps to the reset vector) LIKELY'
  0xfa03:
    name: FuelPulse
    note: 'injection pulse: density x speed x staircase (lag-filtered in $B8) x InjFlags factor x caller factor x ThaCorr x (P34 ? 1.00 : $61) x mixture term, minimum 600 counts -> InjPulse [ROM:$FA03-$FB1F]
      LIKELY'
  0xf7f6:
    name: IgnFixedTest
    note: 'PORT3 bit 0 set: the spark sum is the fixed $00AA instead of the maps (test-terminal fixed timing, GUESS) [ROM:$F7F6-$F7FF]'
data:
- start: 0xf0ff
  end: 0xf116
  name: DensityMaps
  note: 'base fuel vs Load: $F0FF below 3200 rpm, $F10B above; header [offset word, max index], 9 sites [ROM:$FA43] LIKELY (Ross R-F03/R-F06)'
- start: 0xf117
  end: 0xf11c
  name: SecretRpmTbl
  note: rpm fuel correction, active only with P34 = 0 [ROM:$F465] LIKELY (Ross R-F12)
- start: 0xf196
  end: 0xf1ad
  name: DensityFine
  note: 'added to the density map at 1/32 of a base count (base >>3, this >>8): a fine-resolution extension, not a high-MAP bump [ROM:$FA43-$FA52] GUESS'
- start: 0xf1ae
  end: 0xf1b9
  name: SpeedMapLo
  note: rpm correction below 3200 rpm [ROM:$FA66] LIKELY (Ross R-F06)
- start: 0xf1ba
  end: 0xf1c7
  name: SpeedMapHi
  note: 'rpm correction from 3200 rpm: 11 sites 3200-7200 rpm (header max 10) [ROM:$FA55] LIKELY (Ross R-F06)'
- start: 0xf1c8
  end: 0xf1d6
  name: StairLowLoad
  note: 'staircase rpm correction at low Load (no interpolation): entries [rpm word, factor]; the walk is based at $F1C5 and steps 3 before reading [ROM:$FA75-$FA8D] LIKELY'
- start: 0xf1d7
  end: 0xf1ee
  name: StairHighLoad
  note: 'hard-driving staircase at high Load (> $2B8): walk based at $F1D7, entries from $F1DA, sites 3500/4500/5100/5700/6100/6500 rpm [ROM:$FA81-$FA8D] LIKELY (Ross R-F09/R-F10). Never read in the simulator: Load $2B8 is about 120 kPa on the current scale (STATUS conflicts log)'
- start: 0xf1ef
  end: 0xf25c
  name: IgnMapA
  note: 'ignition base map used with P34 = 1: 13 rpm (800-5600, step 400) x 8 Load rows; header [off $0200, max 12, off $04A4, max 7] [ROM:$FDC9] LIKELY'
- start: 0xf25d
  end: 0xf2bd
  name: IgnMapB
  note: 'ignition base map used with P34 = 0 (secret mode if, as likely, the stock P34 is 1; Q10): 13 rpm x 7 Load rows [ROM:$FDD2] LIKELY (Ross R-I15)'
- start: 0xffee
  end: 0xffff
  kind: word
  name: Vectors
  note: '$FFEE: checksum balance word; then SCI, TOF, OCF, ICF, IRQ1, SWI, NMI, RES'
