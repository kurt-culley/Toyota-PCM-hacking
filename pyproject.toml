[project]
name = "pcmre"
version = "0.2.0"
description = "Reverse-engineering tools for the Denso ECU of the mk1 Toyota MR2 (89661-17140)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]  # live captures from the Pico (romcapture, chipdiff capture)

[project.scripts]
pcmre = "pcmre.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcmre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # if/else blocks are often clearer than ternaries here
