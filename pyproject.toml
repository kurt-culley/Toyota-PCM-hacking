[project]
name = "pcmre"
version = "0.1.0"
description = "Reverse-engineering tooling for Denso/Toyota PCMs (mk1 MR2 AW11 project)"
readme = "docs/RE_PLAN.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["analysis"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["analysis", "tests"]
include = ["analysis/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # if/else blocks are often clearer than ternaries here
